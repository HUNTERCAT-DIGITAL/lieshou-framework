# lieshou-framework 质量门禁（GitLab CI · 2026-09）
# 前置：huntercat-digital 组级 docker runner（mesh-dell · tags: java,wqc）
# 门 = mvn -B -ntp verify（含 spotless check）——不留"跳过格式"的假绿
stages: [verify, deploy]

variables:
  # 内网 Caddy 自签证书不在 job 容器信任库 → 放行 git clone（对齐 mobile-web 先例）
  GIT_SSL_NO_VERIFY: "true"

default:
  image: maven:3.9-eclipse-temurin-21
  tags: [java, wqc]
  # 不用 GitLab CI cache：依赖缓存由 runner 宿主卷提供（/srv/gitlab-runner-cache/m2 → /root/.m2）

verify:
  stage: verify
  timeout: 30m
  script:
    - java -version
    - mvn -B -ntp verify
    # 防漂移：两份 framework-* 清单必须同序等长；三处版本号必须一致
    - |
      set -e
      awk '/^ *<dependencyManagement>/,/^ *<\/dependencyManagement>/' pom.xml | grep -o '<artifactId>framework-[a-z0-9-]*</artifactId>' > /tmp/dm-root.txt
      awk '/^ *<dependencyManagement>/,/^ *<\/dependencyManagement>/' framework-parent/pom.xml | grep -o '<artifactId>framework-[a-z0-9-]*</artifactId>' > /tmp/dm-parent.txt
      diff -u /tmp/dm-root.txt /tmp/dm-parent.txt
      root_v=$(grep -A1 '<artifactId>lieshou-framework</artifactId>' pom.xml | tail -1 | sed -E 's/.*<version>([^<]+)<\/version>.*/\1/')
      fp_v=$(grep -A1 '<artifactId>framework-parent</artifactId>' framework-parent/pom.xml | tail -1 | sed -E 's/.*<version>([^<]+)<\/version>.*/\1/')
      prop_v=$(sed -n 's/.*<lieshou-framework\.version>\([^<]*\)<\/lieshou-framework\.version>.*/\1/p' framework-parent/pom.xml)
      [ "$root_v" = "$fp_v" ] && [ "$root_v" = "$prop_v" ] || { echo "❌ 版本漂移 root=$root_v parent=$fp_v prop=$prop_v"; exit 1; }
      for m in $(sed -n '/<modules>/,/<\/modules>/p' pom.xml | grep -oP '(?<=<module>)[^<]+' | grep -v '^framework-parent$'); do
        grep -q "<artifactId>${m}</artifactId>" /tmp/dm-root.txt || { echo "❌ 模块 $m 未出现在根 pom 的 dependencyManagement"; exit 1; }
      done
      echo "✅ framework-* 清单一致（$(wc -l < /tmp/dm-root.txt) 条），版本三处一致（$root_v）"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# 制品发布：仅 tag 触发，发到内网 Nexus maven-releases（凭证在项目 CI 变量 NEXUS_DEPLOY_*）
# 依赖：runner 已 map nexus.ts.huntercat.cn；/root/.m2/caddy-root.crt 为内部 CA（挂载卷自带）
deploy:
  stage: deploy
  timeout: 30m
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    # tag 必须与 pom 版本一致，否则拒发（防止 v0.4.0 下发成 0.3.1）
    - |
      set -e
      ver=$(grep -A1 '<artifactId>lieshou-framework</artifactId>' pom.xml | tail -1 | sed -E 's/.*<version>([^<]+)<\/version>.*/\1/')
      [ "$CI_COMMIT_TAG" = "v$ver" ] || { echo "❌ tag $CI_COMMIT_TAG 与 pom 版本 v$ver 不一致"; exit 1; }
      echo "发布 cn.huntercat:lieshou-framework:$ver → Nexus maven-releases"
    # 内部 CA 进 JVM 信任库（job 容器不认 Caddy 自签 CA）
    - keytool -importcert -noprompt -trustcacerts -alias caddy-root -file /root/.m2/caddy-root.crt -keystore "$JAVA_HOME/lib/security/cacerts" -storepass changeit
    # 只带 <servers>，localRepository 仍走挂载卷 /root/.m2/repository
    - printf '<settings><servers><server><id>nexus</id><username>%s</username><password>%s</password></server></servers></settings>' "$NEXUS_DEPLOY_USER" "$NEXUS_DEPLOY_PASS" > /tmp/ci-settings.xml
    - mvn -B -ntp -s /tmp/ci-settings.xml deploy
